[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-logger"
dynamic = ["version"]
description = "Structured logging utilities for Hummingbot sub-packages"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
]

[tool.hatch.version]
path = "logger/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["logger"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
pandas = ">=2.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
ruff = "=0.15.10"
mypy = ">=1.20.0"
pre-commit = ">=2.15.0"
pandas-stubs = "*"

[tool.pixi.feature.ci.dependencies]
ruff = "=0.15.10"
mypy = ">=1.20.0"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
lint = "ruff check logger tests"
format = "ruff format logger tests"
format-check = "ruff format --check logger tests"
typecheck = "mypy logger"
build = "hatchling build"
coverage = "pytest tests/ --cov=logger --cov-report=term-missing"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "typecheck", "test"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"logger/cli_handler.py" = ["N802", "E501"]
"logger/logger.py" = ["N802", "E501"]
"logger/struct_logger.py" = ["N802", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Vendored from hummingbot/logger upstream — kept in upstream form to ease
# future syncs. Annotations will be added incrementally; for now relax strict
# mode on these specific modules without weakening the package-wide default.
module = [
    "logger",
    "logger.logger",
    "logger.cli_handler",
    "logger.struct_logger",
    "logger.application_warning",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.coverage.run]
branch = true
source_pkgs = ["logger"]
omit = ["logger/__about__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]

[tool.hummingbot.supersedes]
# Modules that this sub-package supersedes in the parent hummingbot install.
# NOTE: hummingbot.logger.log_server_client is intentionally NOT in this list -
# it depends on hummingbot.core.{network_base,network_iterator,utils.async_*}
# and requires its own extraction story. Consumers of log_server_client should
# continue to import it from hummingbot until that work lands.
modules = [
    "hummingbot.logger",
    "hummingbot.logger.application_warning",
    "hummingbot.logger.cli_handler",
    "hummingbot.logger.logger",
    "hummingbot.logger.struct_logger",
]
test_paths = [
    "test/hummingbot/logger/",
]
